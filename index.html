<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>いつ・どこで・だれが・どうした</title>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fffdf7; --fg:#1f2937; --card:#ffffff; --muted:#f2f4f8; --ring:#e8ecf3;
      --acc:#0ea5e9; --radius:22px; --shadow:0 8px 28px rgba(0,0,0,.06);
      --c-itsu:#60a5fa; --c-dokode:#34d399; --c-darega:#f59e0b; --c-doushita:#a78bfa;
      --vh:1vh; /* JSで実寸反映 */
    }
    *{ box-sizing:border-box }
    html,body{ height:100%; overflow:hidden } /* ← ページスクロール禁止 */
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family:"BIZ UDPGothic", system-ui, -apple-system, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height:1.6;
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:12px; height:calc(var(--vh)*100); display:flex; align-items:center; justify-content:center }

    .btn{
      appearance:none; border:none; cursor:pointer; font-weight:800; border-radius:999px;
      padding:12px 18px; font-size:16px; background:#fff; box-shadow:0 2px 0 rgba(0,0,0,.06); border:2px solid var(--ring)
    }
    .btn.acc{ background:var(--acc); color:#fff; border-color:transparent }
    .btn:active{ transform:translateY(1px) }
    .btn[disabled]{ opacity:.5; cursor:not-allowed }
    .btn.smallbtn{ padding:8px 12px; font-size:14px }

    /* 画面（どれもビューポート中央に） */
    .screen{ display:none; width:100%; height:100% }
    .screen.show{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    }

    /* 入力画面：全体が1画面に収まるサイズに調整 */
    .panel{
      background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); border:1px solid var(--ring);
      width:min(100%, 1000px);
    }
    .lists{ display:grid; gap:12px; grid-template-columns:repeat(2,1fr) }
    @media (max-width:820px){ .lists{ grid-template-columns:1fr } }
    .ibox strong{ display:flex; align-items:center; gap:.5em; font-size:18px }
    .tag{ display:inline-flex; align-items:center; justify-content:center; min-width:2em; height:2em; border-radius:999px; color:#fff; font-weight:700; font-size:14px }
    .t-itsu{ background:var(--c-itsu) } .t-dokode{ background:var(--c-dokode) } .t-darega{ background:var(--c-darega) } .t-doushita{ background:var(--c-doushita) }
    textarea{
      width:100%; height:110px; /* 固定高で一画面収める */
      resize:none; border-radius:14px; border:2px solid var(--ring); padding:10px; font-size:16px; background:#fff
    }
    .center{ display:flex; gap:12px; justify-content:center }

    /* カード画面 */
    .topbar{
      width:min(100%, 1100px);
      display:flex; align-items:center; gap:8px; justify-content:space-between;
      padding:8px; background:linear-gradient(#fffdf7, rgba(255,253,247,.7));
      border:1px solid var(--ring); border-radius:12px;
    }
    .topbar .pill{
      display:inline-flex; align-items:center; gap:.5em; padding:6px 12px;
      background:#fff; border:1px solid var(--ring); border-radius:999px; font-weight:900; font-size:14px;
    }
    .topbar .right{ display:flex; gap:8px; align-items:center }

    .stage-cards{
      width:100%; height:calc(var(--vh)*100 - 74px - 24px); /* 74: トップバー高さ相当, 24: 外側余白 */
      display:flex; align-items:center; justify-content:center;
    }
    @media (max-width:820px){
      .stage-cards{ height:calc(var(--vh)*100 - 74px - 20px) }
    }

    .board{
      width:min(100%, 1100px);
      height:min(100%, 720px); /* 盤面自体も最大値で抑える（電子黒板でも大きすぎない） */
      display:grid; gap:12px;
      grid-template-columns:repeat(2,1fr);
      grid-template-rows:repeat(2,1fr); /* 2x2で常に1画面に収める */
    }
    @media (min-width:1000px){
      .board{ grid-template-columns:repeat(4,1fr); grid-template-rows:1fr; } /* 横長なら1行4列 */
    }
    .card{
      background:var(--muted); border-radius:var(--radius); padding:12px;
      display:flex; flex-direction:column; justify-content:space-between; border:2px solid var(--ring); cursor:pointer;
    }
    .label{ font-weight:800; opacity:.95; font-size:18px; display:flex; align-items:center; gap:.5em }
    .label .title{ display:inline-flex; align-items:center; gap:.5em }
    .count{ margin-left:auto; font-weight:900; font-size:14px; background:#fff; border:1px solid var(--ring); border-radius:999px; padding:4px 8px }
    .value{
      font-size:clamp(24px,5vw,40px); font-weight:900; padding:12px; background:#fff; border-radius:16px;
      display:flex; align-items:center; justify-content:center; text-align:center; user-select:none; min-height:72px; height:100%;
    }
    .value[data-hidden="true"]{ color:#9ca3af }

    /* おしまい画面（中央固定） */
    .finishwrap{
      width:min(100%, 1000px); max-height:calc(var(--vh)*100 - 24px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      background:var(--card); border:1px solid var(--ring); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
    }
    .finishwrap .big{ font-size:clamp(28px,6vw,48px); font-weight:900 }
    .finishhist{ width:100% }

    /* モーダル（れきし） */
    .modal{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:16px }
    .modal.show{ display:flex }
    .modal-card{
      width:min(100%, 1000px); max-height:calc(var(--vh)*100 - 32px); overflow:auto;
      background:#fff; border-radius:16px; border:1px solid var(--ring); box-shadow:var(--shadow); padding:14px;
    }
    .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; font-weight:800 }
    .hist{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px }
    .chip{ background:#fff; border:1px solid #e6e6e6; border-radius:999px; padding:8px 12px; font-size:14px }

    .sr{ position:absolute; left:-9999px }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ① 入力画面 -->
    <section id="screen-input" class="screen show">
      <div class="panel">
        <div class="lists">
          <div class="ibox">
            <strong><span class="tag t-itsu">⏰</span> いつ</strong>
            <textarea id="list-itsu" placeholder="1行に1つずつ書いてね"></textarea>
          </div>
          <div class="ibox">
            <strong><span class="tag t-dokode">📍</span> どこで</strong>
            <textarea id="list-dokode" placeholder="こうえんで／がっこうで…"></textarea>
          </div>
          <div class="ibox">
            <strong><span class="tag t-darega">🧑</span> だれが</strong>
            <textarea id="list-darega" placeholder="わたしが／ねこが…"></textarea>
          </div>
          <div class="ibox">
            <strong><span class="tag t-doushita">✨</span> どうした</strong>
            <textarea id="list-doushita" placeholder="おどった／カレーをたべた…"></textarea>
          </div>
        </div>
      </div>
      <div class="center" aria-live="polite">
        <button id="start" class="btn acc">▶︎ スタート</button>
      </div>
    </section>

    <!-- ② カード画面（スクロール無し） -->
    <section id="screen-cards" class="screen">
      <div class="topbar">
        <button id="back" class="btn smallbtn" title="入力にもどる">⤴︎ もどる</button>
        <span id="totalLeft" class="pill">のこり — 問</span>
        <div class="right">
          <button id="openHistory" class="btn smallbtn" title="れきし">📜 れきし</button>
          <button id="next" class="btn acc smallbtn" title="つぎのもんだい" disabled>⏭︎ つぎへ</button>
        </div>
      </div>

      <div class="stage-cards">
        <div class="board" id="board" aria-describedby="live">
          <div class="card" data-key="itsu">
            <div class="label">
              <span class="title"><span class="tag t-itsu">⏰</span> いつ</span>
              <span id="cnt-itsu" class="count">—/—</span>
            </div>
            <div class="value" id="v-itsu" data-hidden="true">タップ！</div>
          </div>
          <div class="card" data-key="dokode">
            <div class="label">
              <span class="title"><span class="tag t-dokode">📍</span> どこで</span>
              <span id="cnt-dokode" class="count">—/—</span>
            </div>
            <div class="value" id="v-dokode" data-hidden="true">タップ！</div>
          </div>
          <div class="card" data-key="darega">
            <div class="label">
              <span class="title"><span class="tag t-darega">🧑</span> だれが</span>
              <span id="cnt-darega" class="count">—/—</span>
            </div>
            <div class="value" id="v-darega" data-hidden="true">タップ！</div>
          </div>
          <div class="card" data-key="doushita">
            <div class="label">
              <span class="title"><span class="tag t-doushita">✨</span> どうした</span>
              <span id="cnt-doushita" class="count">—/—</span>
            </div>
            <div class="value" id="v-doushita" data-hidden="true">タップ！</div>
          </div>
        </div>
      </div>
      <div class="sr" id="live" aria-live="polite"></div>
    </section>

    <!-- ③ おしまい画面（中央固定） -->
    <section id="screen-finish" class="screen">
      <div class="finishwrap">
        <div class="big">おしまい！</div>
        <div class="finishhist">
          <h2>れきし</h2>
          <div id="history-finish" class="hist"></div>
        </div>
        <div>
          <button id="finishBack" class="btn">⤴︎ もどる</button>
        </div>
      </div>
    </section>
  </div>

  <!-- モーダル：れきし -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div id="modalTitle">れきし</div>
        <button id="closeModal" class="btn smallbtn">とじる</button>
      </div>
      <div id="history-modal" class="hist"></div>
    </div>
  </div>

  <script>
    /* === 互換ユーティリティ & 100vh対策 === */
    function setVh(){ try{ var vh = window.innerHeight*0.01; document.documentElement.style.setProperty('--vh', vh+'px'); }catch(e){} }
    setVh(); window.addEventListener('resize', setVh); window.addEventListener('orientationchange', setVh);

    function deepClone(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return o; } }
    function safeParse(key, fallback){
      try{ var s=localStorage.getItem(key); return s ? JSON.parse(s) : deepClone(fallback); }
      catch(e){ return deepClone(fallback); }
    }
    function len(arr){ return Array.isArray(arr) ? arr.length : 0; }
    function shuffleArr(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

    /* 語彙デフォルト */
    var defaults = {
      itsu:["きのう","きょう","あした","あさ","よる","どようび","さんがつじゅうよっかに","しゅくだいのあとに"],
      dokode:["がっこうで","こうえんで","うちで","すいぞくかんで","やまのうえで","うみで","でんしゃのなかで"],
      darega:["わたしが","おとうさんが","おかあさんが","せんせいが","ねこが","ゴリラが","ヒーローが","ともだちが"],
      doushita:["おどった","ねた","べんきょうした","カレーをたべた","ころんだ","わらった","まちがえた","なきだした","ダンスした"]
    };
    var KEYS=["itsu","dokode","darega","doushita"];

    /* 状態 */
    var state={
      lists:safeParse("ichidoko_lists",defaults),
      current:{itsu:"",dokode:"",darega:"",doushita:""},
      revealed:{itsu:false,dokode:false,darega:false,doushita:false},
      history:safeParse("ichidoko_hist",[]) // 最新ゲームのみ
    };
    var decks={itsu:[],dokode:[],darega:[],doushita:[]};

    /* 要素 */
    var $=function(s){return document.querySelector(s);};
    var screenInput=$("#screen-input"), screenCards=$("#screen-cards"), screenFinish=$("#screen-finish");
    var vEls={itsu:$("#v-itsu"),dokode:$("#v-dokode"),darega:$("#v-darega"),doushita:$("#v-doushita")};
    var cEls={itsu:$("#cnt-itsu"),dokode:$("#cnt-dokode"),darega:$("#cnt-darega"),doushita:$("#cnt-doushita")};
    var tEls={ itsu:$("#list-itsu"), dokode:$("#list-dokode"), darega:$("#list-darega"), doushita:$("#list-doushita") };
    var histFinishEl=$("#history-finish"), histModalEl=$("#history-modal");
    var totalLeftEl=$("#totalLeft"), nextBtn=$("#next");
    var modal=$("#modal");

    function save(){ try{
      localStorage.setItem("ichidoko_lists",JSON.stringify(state.lists));
      localStorage.setItem("ichidoko_hist",JSON.stringify(state.history));
    }catch(e){} }
    function linesToList(txt){ return String(txt||"").split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return !!s;}); }
    function listToLines(arr){ return (arr||[]).join("\n"); }

    /* 履歴描画（おしまい＋モーダル） */
    function renderHistoryInto(el){
      if(!el) return;
      el.innerHTML="";
      for(var i=0;i<state.history.length;i++){
        var span=document.createElement("span");
        span.className="chip"; span.textContent=state.history[i];
        el.appendChild(span);
      }
    }
    function renderHistory(){ renderHistoryInto(histFinishEl); renderHistoryInto(histModalEl); }
    renderHistory();

    /* 画面切替 */
    function showScreen(name){
      screenInput.classList.toggle("show",name==="input");
      screenCards.classList.toggle("show",name==="cards");
      screenFinish.classList.toggle("show",name==="finish");
    }

    /* 表示制御 */
    function setHidden(k,hidden){ if(hidden===void 0) hidden=true;
      vEls[k].dataset.hidden=hidden?"true":"false";
      vEls[k].textContent=hidden?"タップ！":(state.current[k]||"—");
    }
    function allRevealed(){ for(var i=0;i<KEYS.length;i++){ if(!state.revealed[KEYS[i]]) return false; } return true; }
    function currentSentence(){ return state.current.itsu+state.current.dokode+state.current.darega+state.current.doushita+"。"; }
    function addHistoryIfComplete(){
      if(allRevealed()){
        var s=currentSentence();
        var filtered=[]; for(var i=0;i<state.history.length;i++){ if(state.history[i]!==s) filtered.push(state.history[i]); }
        state.history=[s].concat(filtered);
        save(); renderHistory();
        nextBtn.disabled=false;
      }
    }

    /* 残り表示 */
    function updateCardCounts(){
      for(var i=0;i<KEYS.length;i++){
        var k=KEYS[i], total=(state.lists[k]||[]).length, left=(decks[k]||[]).length;
        cEls[k].textContent=left+"/"+total;
      }
    }
    function remainingProblems(){
      var mins=Infinity; for(var i=0;i<KEYS.length;i++){ var l=(decks[KEYS[i]]||[]).length; if(l<mins) mins=l; }
      return isFinite(mins)?mins:0;
    }
    function updateTotalLeft(){ totalLeftEl.textContent="のこり "+remainingProblems()+" 問"; }
    function updateAllCounts(){ updateCardCounts(); updateTotalLeft(); }

    /* データ準備 */
    function ensureListsFilled(){
      var changed=false;
      for(var i=0;i<KEYS.length;i++){
        var k=KEYS[i];
        if(!Array.isArray(state.lists[k])||state.lists[k].length===0){ state.lists[k]=deepClone(defaults[k]); changed=true; }
      }
      if(changed) save();
    }
    function buildDecks(){
      decks={
        itsu:shuffleArr((state.lists.itsu||[]).slice()),
        dokode:shuffleArr((state.lists.dokode||[]).slice()),
        darega:shuffleArr((state.lists.darega||[]).slice()),
        doushita:shuffleArr((state.lists.doushita||[]).slice())
      };
      updateAllCounts();
    }
    function drawFromDeck(k){ var d=decks[k]; if(!Array.isArray(d)||d.length===0) return undefined; return d.shift(); }

    function prepareRound(useDeck){ if(useDeck===void 0) useDeck=true;
      if(useDeck){ for(var i=0;i<KEYS.length;i++){ var k=KEYS[i]; state.current[k]=drawFromDeck(k); } }
      for(var j=0;j<KEYS.length;j++){ var kk=KEYS[j]; state.revealed[kk]=false; setHidden(kk,true); }
      nextBtn.disabled=true; updateAllCounts();
    }

    /* 入力テキスト保存 */
    for(var i0=0;i0<KEYS.length;i0++){
      (function(k){
        tEls[k].value=listToLines(state.lists[k]);
        tEls[k].addEventListener("input",function(){ state.lists[k]=linesToList(tEls[k].value); save(); });
      })(KEYS[i0]);
    }

    /* カードタップ */
    var cards=document.querySelectorAll(".card");
    for(var i1=0;i1<cards.length;i1++){
      (function(card){
        var key=card.getAttribute("data-key");
        card.addEventListener("click",function(){
          if(!state.revealed[key]){
            state.revealed[key]=true; setHidden(key,false); addHistoryIfComplete();
          }
        });
      })(cards[i1]);
    }

    /* モーダル（れきし） */
    function openModal(){ modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); }
    function closeModal(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
    $("#openHistory").addEventListener("click", openModal);
    $("#closeModal").addEventListener("click", closeModal);
    modal.addEventListener("click", function(e){ if(e.target===modal) closeModal(); });

    /* 操作 */
    $("#back").addEventListener("click",function(){ showScreen("input"); });
    $("#finishBack").addEventListener("click",function(){ showScreen("input"); });
    $("#next").addEventListener("click",function(){
      if(remainingProblems()<=0){ showScreen("finish"); return; }
      prepareRound(true);
    });

    /* スタート（最新ゲームのみ保存） */
    $("#start").addEventListener("click",function(){
      ensureListsFilled();
      state.history=[]; save(); renderHistory();
      buildDecks();
      for(var i=0;i<KEYS.length;i++){ state.current[KEYS[i]]=""; }
      prepareRound(true);
      showScreen("cards");
    });

    /* サンプル */
    $("#fillSamples").addEventListener("click",function(){
      state.lists=deepClone(defaults);
      for(var i=0;i<KEYS.length;i++){ var k=KEYS[i]; tEls[k].value=listToLines(state.lists[k]); }
      save();
    });

    /* 初期 */
    showScreen("input");
  </script>
</body>
</html>
